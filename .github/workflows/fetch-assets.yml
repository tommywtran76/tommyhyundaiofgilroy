name: Fetch campaign assets

on:
  push:
    branches: [claude/luxury-brand-website-gw73f3]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/luxury-brand-website-gw73f3
      - name: Download tearoom image
        run: |
          set -e
          mkdir -p aileens/assets/img
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X"
          curl -fsSL "$base/hf_20260723_052807_47736f80-1906-41aa-815d-751eb198f329.png" -o aileens/assets/img/tearoom-new.png
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aileens/assets/img
          git commit -m "Fetch tearoom image" || exit 0
          git push
