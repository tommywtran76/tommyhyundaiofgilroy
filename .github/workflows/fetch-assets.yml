name: Fetch campaign assets

on:
  workflow_dispatch:
  push:
    branches: [claude/luxury-brand-website-gw73f3]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/luxury-brand-website-gw73f3
      - name: Download user's clean before/after photos
        run: |
          set -e
          mkdir -p aileens/assets/img
          mbase="https://d2ol7oe51mr4n9.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X"
          curl -fsSL "$mbase/d60bef2d-23cb-4259-834a-b8ca8d6856c4.png" -o aileens/assets/img/user-before.png
          curl -fsSL "$mbase/c4f38b2e-b79f-4feb-a806-9f973f674d67.jpg" -o aileens/assets/img/user-after.jpg
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aileens/assets/img
          git commit -m "Fetch user-provided before/after photos" || exit 0
          git push
