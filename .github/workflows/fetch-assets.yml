name: Fetch campaign assets

on:
  workflow_dispatch:
  push:
    branches: [claude/luxury-brand-website-gw73f3]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/luxury-brand-website-gw73f3
      - name: Download full-face before/after originals
        run: |
          set -e
          mkdir -p aileens/assets/img
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X"
          curl -fsSL "$base/hf_20260722_162328_dbec5e82-d3f4-4e09-8976-b909393eb717.png" -o aileens/assets/img/before-face.png
          curl -fsSL "$base/hf_20260722_162330_dfb48330-b9b3-4aee-9b3d-604237899821.png" -o aileens/assets/img/after-face.png
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aileens/assets/img
          git commit -m "Fetch full-face before/after originals" || exit 0
          git push
