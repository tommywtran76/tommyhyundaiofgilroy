name: Fetch campaign assets
on:
  push:
    branches: [claude/luxury-brand-website-gw73f3]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          curl -fsSL -o aileen-up1.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X/262074f9-88e2-4105-9699-b18500700f3f.png"
          curl -fsSL -o aileen-up2.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X/d697d732-4d32-49ba-bcdc-b32cc563c360.png"
          curl -fsSL -o aileen-up3.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X/955a0874-e31f-4728-aff5-4fff2403ae62.png"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aileen-up1.png aileen-up2.png aileen-up3.png
          git commit -m "Fetch uploaded Aileen photos" || echo "nothing to commit"
          git push
