name: Fetch campaign assets

on:
  push:
    branches: [claude/luxury-brand-website-gw73f3]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/luxury-brand-website-gw73f3
      - name: Download user's premium tearoom edit
        run: |
          set -e
          mkdir -p aileens/assets/img
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X"
          curl -fsSL "$base/hf_20260723_052949_caf4de4d-23a9-4629-aed8-6676f8847881.png" -o aileens/assets/img/tearoom-v2.png
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aileens/assets/img
          git commit -m "Fetch user's tearoom edit" || exit 0
          git push
