name: Fetch campaign assets

on:
  push:
    branches: [claude/luxury-brand-website-gw73f3]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/luxury-brand-website-gw73f3
      - name: Download model before/after pair
        run: |
          set -e
          mkdir -p aileens/assets/img
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X"
          curl -fsSL "$base/hf_20260722_205557_c75dd800-d75a-48fb-8826-06f560cfb73a.png" -o aileens/assets/img/model-before.png
          curl -fsSL "$base/hf_20260722_205559_5c530368-b53d-49fd-a25a-5a386aa311ed.png" -o aileens/assets/img/model-after.png
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aileens/assets/img
          git commit -m "Fetch model before/after pair" || exit 0
          git push
