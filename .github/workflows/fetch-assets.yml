name: Fetch campaign assets

on:
  push:
    branches: [claude/luxury-brand-website-gw73f3]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/luxury-brand-website-gw73f3
      - name: Download after-hours image
        run: |
          set -e
          mkdir -p assets/img
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3GOOQes5XcbXRDnFW2q49JQyg8X"
          curl -fsSL "$base/hf_20260723_052327_ae73394d-9341-4f71-9856-fa23aaadd5e2.png" -o assets/img/after-hours-src.png
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Fetch after-hours image" || exit 0
          git push
